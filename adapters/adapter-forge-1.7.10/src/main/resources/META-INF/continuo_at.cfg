# Makes KeyBinding.pressed settable on a chosen binding instance.
#
# 1.7.10's only public route is the static, keycode-addressed
# KeyBinding.setKeyBindState(int, boolean), which addresses whichever binding currently holds
# that keycode rather than one the adapter chose, and silently does nothing on a key the user
# has left unbound. That route is not conformant with IActuator. See the A2a design, 3.2.
#
# An access transformer is not a mixin, so this does not breach the roadmap's
# "UniMixins not before M3" line.
public net.minecraft.client.settings.KeyBinding field_74513_e # pressed
