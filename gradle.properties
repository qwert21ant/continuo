org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# The Gradle daemon must run on Java 25 (RetroFuturaGradle requires it; Fabric Loom was
# verified to work fine on it too). That is pinned portably by
# gradle/gradle-daemon-jvm.properties (toolchainVersion=25), generated via
# `./gradlew updateDaemonJvm --jvm-version=25`. Do NOT commit a machine-specific absolute
# JDK path here - org.gradle.java.home hard-fails every Gradle invocation on any machine
# that lacks that exact path, including CI. Put local overrides in ~/.gradle/gradle.properties.

group=dev.continuo
version=0.1.0-SNAPSHOT

minecraft_version=1.21.11
loader_version=0.19.3
fabric_version=0.141.6+1.21.11

forge_mc_version=1.7.10

junit_version=5.11.4
